<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Varnam Silks - Add Product
    </title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family: Arial, sans-serif;

            background: #f8f2ed;

            color: #321039;
        }


        /* =========================
           HEADER
        ========================= */

        .admin-header {

            height: 64px;

            background: #321039;

            display: flex;

            align-items: center;

            padding: 0 16px;

            color: white;

            position: sticky;

            top: 0;

            z-index: 100;
        }


        .back-btn {

            width: 38px;

            height: 38px;

            border: none;

            background: transparent;

            color: white;

            font-size: 25px;

            cursor: pointer;

            margin-right: 8px;
        }


        .header-title {

            flex: 1;
        }


        .header-title h1 {

            font-size: 17px;

            letter-spacing: 1px;
        }


        .header-title span {

            display: block;

            color: #d7a849;

            font-size: 9px;

            letter-spacing: 1.5px;

            margin-top: 3px;
        }


        /* =========================
           PAGE
        ========================= */

        .page {

            max-width: 850px;

            margin: auto;

            padding: 20px 16px 45px;
        }


        .page-heading {

            margin-bottom: 20px;
        }


        .page-heading h2 {

            font-size: 22px;

            margin-bottom: 5px;

            color: #321039;
        }


        .page-heading p {

            font-size: 12px;

            color: #777;

            line-height: 1.5;
        }


        /* =========================
           FORM CARD
        ========================= */

        .form-card {

            background: white;

            border: 1px solid #eadfd8;

            border-radius: 10px;

            padding: 18px;

            margin-bottom: 16px;

            box-shadow:
                0 3px 12px
                rgba(50, 16, 57, 0.05);
        }


        .card-title {

            font-size: 15px;

            font-weight: bold;

            color: #321039;

            margin-bottom: 16px;

            padding-bottom: 10px;

            border-bottom: 1px solid #eee;
        }


        /* =========================
           IMAGE UPLOAD
        ========================= */

        .image-upload {

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            width: 100%;

            min-height: 220px;

            border: 1.5px dashed #cdbdb5;

            border-radius: 8px;

            background: #fdfaf8;

            cursor: pointer;

            overflow: hidden;

            position: relative;
        }


        .image-upload:hover {

            border-color: #321039;
        }


        .upload-icon {

            font-size: 35px;

            margin-bottom: 10px;
        }


        .upload-title {

            font-size: 13px;

            font-weight: bold;

            color: #321039;

            margin-bottom: 5px;
        }


        .upload-text {

            font-size: 10px;

            color: #999;

            text-align: center;
        }


        .image-preview {

            width: 100%;

            height: 260px;

            object-fit: contain;

            background: #f8f2ed;

            display: none;
        }


        .image-upload.has-image
        .upload-content {

            display: none;
        }


        .image-upload.has-image
        .image-preview {

            display: block;
        }


        #productImage {

    display: none;
        }


        /* =========================
           FORM GROUP
        ========================= */

        .form-group {

            margin-bottom: 15px;
        }


        .form-group:last-child {

            margin-bottom: 0;
        }


        label {

            display: block;

            font-size: 11px;

            font-weight: bold;

            color: #321039;

            margin-bottom: 7px;
        }


        .required {

            color: #a33a3a;
        }


        input,
        textarea,
        select {

            width: 100%;

            border: 1px solid #ddd1ca;

            border-radius: 6px;

            outline: none;

            background: white;

            color: #321039;

            font-family: Arial, sans-serif;

            font-size: 12px;

            padding: 11px 12px;
        }


        input:focus,
        textarea:focus,
        select:focus {

            border-color: #321039;
        }


        textarea {

            min-height: 100px;

            resize: vertical;

            line-height: 1.5;
        }


        .form-row {

            display: grid;

            grid-template-columns:
                1fr;

            gap: 15px;
        }


        .input-help {

            font-size: 9px;

            color: #999;

            margin-top: 5px;

            line-height: 1.4;
        }


        /* =========================
           CHECKBOXES
        ========================= */

        .options-grid {

            display: grid;

            grid-template-columns:
                1fr;

            gap: 10px;
        }


        .check-option {

            display: flex;

            align-items: center;

            gap: 9px;

            padding: 11px;

            border: 1px solid #eadfd8;

            border-radius: 6px;

            cursor: pointer;

            background: #fdfaf8;
        }


        .check-option input {

            width: auto;

            accent-color: #321039;
        }


        .check-option span {

            font-size: 11px;

            color: #321039;
        }


        /* =========================
           BUTTONS
        ========================= */

        .button-row {

            display: flex;

            flex-direction: column;

            gap: 9px;

            margin-top: 20px;
        }


        .save-btn,
        .cancel-btn {

            width: 100%;

            height: 45px;

            border-radius: 7px;

            font-size: 12px;

            font-weight: bold;

            cursor: pointer;
        }


        .save-btn {

            background: #321039;

            color: white;

            border: 1px solid #321039;
        }


        .save-btn:hover {

            background: #44204b;
        }


        .cancel-btn {

            background: white;

            color: #321039;

            border: 1px solid #321039;
        }


        /* =========================
           ERROR
        ========================= */

        .error-message {

            display: none;

            background: #fff0f0;

            border: 1px solid #e7bcbc;

            color: #9b3333;

            border-radius: 6px;

            padding: 10px 12px;

            font-size: 10px;

            line-height: 1.5;

            margin-bottom: 15px;
        }


        /* =========================
           DESKTOP
        ========================= */

        @media (min-width: 700px) {

            .page {

                padding: 28px;
            }


            .admin-header {

                padding: 0 28px;
            }


            .form-card {

                padding: 22px;
            }


            .form-row {

                grid-template-columns:
                    1fr 1fr;
            }


            .options-grid {

                grid-template-columns:
                    repeat(3, 1fr);
            }


            .button-row {

                flex-direction: row;

                justify-content: flex-end;
            }


            .save-btn,
            .cancel-btn {

                width: 160px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <header class="admin-header">


        <button
            class="back-btn"
            id="backBtn"
            aria-label="Back"
        >
            ←
        </button>


        <div class="header-title">

            <h1>
                VARNAM SILKS
            </h1>

            <span>
                ADD PRODUCT
            </span>

        </div>


    </header>


    <!-- =========================
         MAIN
    ========================= -->

    <main class="page">


        <!-- PAGE HEADING -->

        <section class="page-heading">

            <h2>
                Add New Product
            </h2>

            <p>
                Add a new saree to your Varnam Silks collection.
            </p>

        </section>


        <!-- ERROR -->

        <div
            class="error-message"
            id="errorMessage"
        >
        </div>


        <!-- =========================
             IMAGE
        ========================= -->

        <section class="form-card">

            <h3 class="card-title">
                Product Image
            </h3>


          <label
    class="image-upload"
    id="imageUpload"
>

    <input
        type="file"
        id="productImage"
        accept="image/*"
    >

    <div class="upload-content">

        <div class="upload-icon">
            🖼️
        </div>

        <div class="upload-title">
            Upload Product Image
        </div>

        <div class="upload-text">
            Tap here to choose a saree image
            <br>
            JPG, PNG or WEBP
        </div>

    </div>

    <img
        class="image-preview"
        id="imagePreview"
        alt="Product preview"
    >

          </label>


            <p class="input-help">
                Use a clear, high-quality product image.
            </p>

        </section>


        <!-- =========================
             BASIC INFORMATION
        ========================= -->

        <section class="form-card">

            <h3 class="card-title">
                Product Information
            </h3>


            <div class="form-group">

                <label for="productName">

                    Product Name
                    <span class="required">*</span>

                </label>


                <input
                    type="text"
                    id="productName"
                    placeholder="Example: Royal Kanchipuram Silk Saree"
                    maxlength="100"
                >

            </div>


            <div class="form-row">


                <div class="form-group">

                    <label for="productPrice">

                        Price
                        <span class="required">*</span>

                    </label>


                    <input
                        type="number"
                        id="productPrice"
                        placeholder="Example: 2999"
                        min="1"
                        step="1"
                    >

                </div>


                <div class="form-group">

                    <label for="productStock">

                        Stock Quantity
                        <span class="required">*</span>

                    </label>


                    <input
                        type="number"
                        id="productStock"
                        placeholder="Example: 10"
                        min="0"
                        step="1"
                    >

                </div>


            </div>


            <div class="form-group">

                <label for="productCategory">

                    Category
                    <span class="required">*</span>

                </label>


                <select
                    id="productCategory"
                >

                    <option value="">
                        Select category
                    </option>

                    <option value="Kanchipuram Silk">
                        Kanchipuram Silk
                    </option>

                    <option value="Soft Silk">
                        Soft Silk
                    </option>
                  <option value="Silk Sarees">Silk Sarees</option>

                    <option value="Banarasi Silk">
                        Banarasi Silk
                    </option>

                    <option value="Designer Sarees">
                        Designer Sarees
                    </option>

                    <option value="Wedding Sarees">
                        Wedding Sarees
                    </option>

                    <option value="Festive Sarees">
                        Festive Sarees
                    </option>

                    <option value="New Arrivals">
                        New Arrivals
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="productDescription">

                    Description

                </label>


                <textarea
                    id="productDescription"
                    placeholder="Describe the saree, fabric, design, occasion, etc."
                    maxlength="1000"
                ></textarea>


                <p class="input-help">
                    Give customers useful information about this saree.
                </p>

            </div>

        </section>


        <!-- =========================
             PRODUCT OPTIONS
        ========================= -->

        <section class="form-card">

            <h3 class="card-title">
                Product Options
            </h3>


            <div class="options-grid">


                <label class="check-option">

                    <input
                        type="checkbox"
                        id="isNewArrival"
                    >

                    <span>
                        New Arrival
                    </span>

                </label>


                <label class="check-option">

                    <input
                        type="checkbox"
                        id="isBestSelling"
                    >

                    <span>
                        Best Selling
                    </span>

                </label>


                <label class="check-option">

                    <input
                        type="checkbox"
                        id="isFeatured"
                    >

                    <span>
                        Featured Product
                    </span>

                </label>


            </div>

        </section>


        <!-- =========================
             BUTTONS
        ========================= -->

        <div class="button-row">


            <button
                class="cancel-btn"
                id="cancelBtn"
                type="button"
            >
                Cancel
            </button>


            <button
                class="save-btn"
                id="saveProductBtn"
                type="button"
            >
                Save Product
            </button>


        </div>


    </main>


    <!-- PART 2 GOES HERE -->
  <script>

/* ==========================================
   ADD PRODUCT
========================================== */


/* ==========================================
   ELEMENTS
========================================== */

const imageInput =
    document.getElementById(
        "productImage"
    );

const imageUpload =
    document.getElementById(
        "imageUpload"
    );

const imagePreview =
    document.getElementById(
        "imagePreview"
    );

const errorMessage =
    document.getElementById(
        "errorMessage"
    );

    /* ==========================================
   IMAGE PREVIEW
========================================== */

function showSelectedImage(file) {

    if (!file) {
        return;
    }


    if (!file.type.startsWith("image/")) {

        showError(
            "Please select an image."
        );

        return;

    }


    const reader =
        new FileReader();


    reader.onload = function(event) {

        imagePreview.src =
            event.target.result;

        imageUpload.classList.add(
            "has-image"
        );

        hideError();

    };


    reader.onerror = function() {

        showError(
            "Unable to read the selected image."
        );

    };


    reader.readAsDataURL(file);

}


/* ==========================================
   IMAGE SELECT
========================================== */

imageInput.addEventListener(
    "change",
    function() {

        const file =
            this.files &&
            this.files[0];


        if (file) {

            showSelectedImage(file);

        }

    }
);


/* ==========================================
   ERROR
========================================== */

function showError(message) {

    errorMessage.textContent =
        message;

    errorMessage.style.display =
        "block";


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}


function hideError() {

    errorMessage.textContent = "";

    errorMessage.style.display =
        "none";

}


/* ==========================================
   VALIDATE FORM
========================================== */

function validateForm() {

    const name =
        document.getElementById(
            "productName"
        ).value.trim();


    const price =
        Number(
            document.getElementById(
                "productPrice"
            ).value
        );


    const stock =
        Number(
            document.getElementById(
                "productStock"
            ).value
        );


    const category =
        document.getElementById(
            "productCategory"
        ).value;


    if (!name) {

        showError(
            "Please enter the product name."
        );

        return false;

    }


    if (
        !price ||
        price <= 0
    ) {

        showError(
            "Please enter a valid product price."
        );

        return false;

    }


    if (
        stock < 0 ||
        isNaN(stock)
    ) {

        showError(
            "Please enter a valid stock quantity."
        );

        return false;

    }


    if (!category) {

        showError(
            "Please select a product category."
        );

        return false;

    }


    hideError();

    return true;

}


/* ==========================================
   SAVE PRODUCT
========================================== */

document
    .getElementById("saveProductBtn")
    .addEventListener(
        "click",
        function() {

            if (!validateForm()) {
                return;
            }


            const name =
                document.getElementById(
                    "productName"
                ).value.trim();


            const price =
                Number(
                    document.getElementById(
                        "productPrice"
                    ).value
                );


            const stock =
                Number(
                    document.getElementById(
                        "productStock"
                    ).value
                );


            const category =
                document.getElementById(
                    "productCategory"
                ).value;


            const description =
                document.getElementById(
                    "productDescription"
                ).value.trim();


            const isNewArrival =
                document.getElementById(
                    "isNewArrival"
                ).checked;


            const isBestSelling =
                document.getElementById(
                    "isBestSelling"
                ).checked;


            const isFeatured =
                document.getElementById(
                    "isFeatured"
                ).checked;


            const file =
                imageInput.files[0];


            const product = {

                id:
                    "VS-" + Date.now(),

                name:
                    name,

                price:
                    price,

                stock:
                    stock,

                category:
                    category,

                description:
                    description,

                isNewArrival:
                    isNewArrival,

                isBestSelling:
                    isBestSelling,

                isFeatured:
                    isFeatured,

                image:
                    "",

                createdAt:
                    new Date().toISOString()

            };


            /* =================================
               SAVE PRODUCT DATA
            ================================= */

            function saveProductData() {

                let savedProducts = [];


                try {

                    const existing =
                        localStorage.getItem(
                            "varnamAdminProducts"
                        );


                    if (existing) {

                        savedProducts =
                            JSON.parse(existing);

                    }


                    if (
                        !Array.isArray(
                            savedProducts
                        )
                    ) {

                        savedProducts = [];

                    }

                } catch (error) {

                    savedProducts = [];

                }


                savedProducts.unshift(
                    product
                );


                localStorage.setItem(
                    "varnamAdminProducts",
                    JSON.stringify(
                        savedProducts
                    )
                );


                alert(
                    "Product saved successfully."
                );


                window.location.href =
                    "admin-products.html";

            }


          /* =================================
   SAVE SELECTED IMAGE
================================= */

if (file) {

    const reader =
        new FileReader();


    reader.onload =
        function(event) {

            const img =
                new Image();


            img.onload =
                function() {

                    const canvas =
                        document.createElement(
                            "canvas"
                        );


                    const maxWidth = 800;


                    let width =
                        img.width;


                    let height =
                        img.height;


                    if (width > maxWidth) {

                        height =
                            height *
                            (maxWidth / width);

                        width =
                            maxWidth;

                    }


                    canvas.width =
                        width;

                    canvas.height =
                        height;


                    const ctx =
                        canvas.getContext(
                            "2d"
                        );


                    ctx.drawImage(
                        img,
                        0,
                        0,
                        width,
                        height
                    );


                    product.image =
                        canvas.toDataURL(
                            "image/jpeg",
                            0.75
                        );


                    try {

                        saveProductData();

                    } catch (error) {

                        showError(
                            "Image is too large. Please choose a smaller image."
                        );

                    }

                };


            img.src =
                event.target.result;

        };


    reader.readAsDataURL(
        file
    );


} else {

    saveProductData();

}
        }
    );





/* ==========================================
   CANCEL
========================================== */

document
    .getElementById(
        "cancelBtn"
    )
    .addEventListener(
        "click",
        function() {

            window.location.href =
                "admin-products.html";

        }
    );


/* ==========================================
   BACK BUTTON
========================================== */

document
    .getElementById(
        "backBtn"
    )
    .addEventListener(
        "click",
        function() {

            window.location.href =
                "admin-products.html";

        }
    );

  </script>


</body>

</html>
