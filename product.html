<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Product | Varnam Silks
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >


    <style>

        /* ==========================================
           PRODUCT PAGE
           ========================================== */

        .product-page {

            max-width: 1100px;

            margin: auto;

            padding: 25px 16px 70px;

        }


        /* ==========================================
           BACK BUTTON
           ========================================== */

        .product-back {

            display: inline-flex;

            align-items: center;

            gap: 7px;

            border: none;

            background: transparent;

            color: var(--maroon);

            font-size: 14px;

            padding: 5px 0;

            margin-bottom: 22px;

        }


        .product-back:hover {

            color: var(--gold);

        }


        /* ==========================================
           PRODUCT LAYOUT
           ========================================== */

        .product-detail {

            display: grid;

            grid-template-columns: 1fr;

            gap: 28px;

        }


        /* ==========================================
           IMAGE
           ========================================== */

        .product-image-box {

            width: 100%;

            background: var(--cream-dark);

            border: 1px solid var(--border);

            border-radius: 8px;

            overflow: hidden;

        }


        .product-detail-image {

            width: 100%;

            aspect-ratio: 0.78;

            object-fit: cover;

            display: block;

        }


        /* ==========================================
           PRODUCT INFO
           ========================================== */

        .product-info {

            padding: 5px 0;

        }


        .product-category {

            color: var(--gold);

            font-family: Arial, sans-serif;

            font-size: 11px;

            letter-spacing: 3px;

            text-transform: uppercase;

            margin-bottom: 12px;

        }


        .product-name {

            color: var(--maroon);

            font-size: 31px;

            line-height: 1.15;

            font-weight: 500;

            margin-bottom: 17px;

        }


        .product-price {

            color: var(--maroon);

            font-family: Arial, sans-serif;

            font-size: 27px;

            font-weight: 700;

            margin-bottom: 18px;

        }


        /* ==========================================
           STOCK
           ========================================== */

        .product-stock {

            display: inline-flex;

            align-items: center;

            padding: 9px 14px;

            background: #edf7ef;

            color: #356641;

            border-radius: 5px;

            font-family: Arial, sans-serif;

            font-size: 12px;

            margin-bottom: 22px;

        }


        /* ==========================================
           DESCRIPTION
           ========================================== */

        .product-description {

            color: var(--muted);

            font-family: Arial, sans-serif;

            font-size: 14px;

            line-height: 1.8;

            padding-bottom: 22px;

            border-bottom: 1px solid var(--border);

        }


        /* ==========================================
           QUANTITY
           ========================================== */

        .quantity-section {

            margin-top: 22px;

        }


        .quantity-label {

            display: block;

            color: var(--text);

            font-family: Arial, sans-serif;

            font-size: 13px;

            font-weight: 700;

            margin-bottom: 9px;

        }


        .quantity-control {

            display: flex;

            width: 135px;

            height: 43px;

            border: 1px solid var(--border);

            background: var(--white);

            border-radius: 4px;

            overflow: hidden;

        }


        .quantity-control button {

            width: 43px;

            height: 100%;

            border: none;

            background: var(--cream);

            color: var(--maroon);

            font-size: 20px;

        }


        .quantity-control button:hover {

            background: var(--cream-dark);

        }


        .quantity-control span {

            flex: 1;

            display: flex;

            align-items: center;

            justify-content: center;

            color: var(--text);

            font-family: Arial, sans-serif;

            font-size: 14px;

        }


        /* ==========================================
           ACTION BUTTONS
           ========================================== */

        .product-actions {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 10px;

            margin-top: 22px;

        }


        .product-actions button {

            height: 50px;

            border-radius: 4px;

            font-size: 13px;

            letter-spacing: .3px;

        }


        .add-cart-button {

            border: 1px solid var(--maroon);

            background: transparent;

            color: var(--maroon);

        }


        .add-cart-button:hover {

            background: var(--maroon);

            color: var(--white);

        }


        .buy-now-button {

            border: 1px solid var(--maroon);

            background: var(--maroon);

            color: var(--white);

        }


        .buy-now-button:hover {

            background: var(--dark-maroon);

        }


        /* ==========================================
           DELIVERY
           ========================================== */

        .delivery-card {

            margin-top: 22px;

            padding: 17px;

            border: 1px solid var(--border);

            background: var(--white);

            border-radius: 5px;

        }


        .delivery-card h3 {

            color: var(--maroon);

            font-size: 16px;

            font-weight: 600;

            margin-bottom: 7px;

        }


        .delivery-card p {

            color: var(--muted);

            font-family: Arial, sans-serif;

            font-size: 11px;

            line-height: 1.6;

        }


        /* ==========================================
           PRODUCT NOT FOUND
           ========================================== */

        .product-not-found {

            text-align: center;

            padding: 80px 20px;

        }


        .product-not-found h2 {

            color: var(--maroon);

            font-size: 24px;

            margin-bottom: 15px;

        }


        .back-shop-button {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            height: 44px;

            padding: 0 22px;

            background: var(--maroon);

            color: var(--white);

            border-radius: 3px;

            font-size: 12px;

        }


        /* ==========================================
           DESKTOP
           ========================================== */

        @media (min-width: 700px) {

            .product-page {

                padding: 45px 25px 90px;

            }


            .product-detail {

                grid-template-columns:
                    minmax(0, 1fr)
                    minmax(0, 1fr);

                gap: 50px;

                align-items: start;

            }


            .product-image-box {

                max-width: 520px;

                margin: auto;

            }


            .product-info {

                padding-top: 20px;

            }


            .product-name {

                font-size: 42px;

            }


            .product-price {

                font-size: 30px;

            }


            .product-description {

                font-size: 15px;

            }

        }

    </style>

</head>


<body>


    <!-- ==========================================
         TOPBAR
         ========================================== -->

    <header class="topbar">


        <button
            class="icon-btn"
            id="backTopButton"
            aria-label="Go back"
        >
            ←
        </button>


        <div class="brand">

            <div class="brand-name">
                VARNAM SILKS
            </div>

            <div class="brand-tagline">
                SAREES THAT SPEAK ELEGANCE
            </div>

        </div>


        <button
            class="icon-btn"
            id="productCartButton"
            aria-label="Shopping cart"
        >

            🛒

            <span
                class="cart-count"
                id="productCartCount"
            >
                0
            </span>

        </button>


    </header>


    <!-- ==========================================
         PRODUCT PAGE
         ========================================== -->

    <main class="product-page">


        <button
            class="product-back"
            id="backButton"
        >
            ← Back to Sarees
        </button>


        <div
            class="product-detail"
            id="productDetail"
        >

            <!-- Product inserted by JavaScript -->

        </div>


    </main>


    <!-- ==========================================
         PRODUCT DATA
         ========================================== -->

    <script src="product-data.js"></script>


    <!-- ==========================================
         PRODUCT PAGE JAVASCRIPT
         ========================================== -->

    <script>

        /* ==========================================
           GET PRODUCT ID
           ========================================== */

        const urlParams =
            new URLSearchParams(
                window.location.search
            );


        const productId =
    urlParams.get("id");


        /* ==========================================
           FIND PRODUCT
           ========================================== */

        let selectedProduct =
    products.find(
        item =>
            String(item.id) === String(productId)
    );


/* ==========================================
   LOAD ADMIN PRODUCTS
   ========================================== */

try {

    const saved =
        localStorage.getItem(
            "varnamAdminProducts"
        );

    if (saved) {

        const adminProducts =
            JSON.parse(saved);

        if (Array.isArray(adminProducts)) {

            const adminProduct =
                adminProducts.find(
                    item =>
                        String(item.id) ===
                        String(productId)
                );

            if (adminProduct) {

                selectedProduct = {

    id:
        adminProduct.id,

    name:
        adminProduct.name,

    type:
        adminProduct.category ||
        "Sarees",

    price:
        Number(
            adminProduct.price
        ),

    image:
        adminProduct.image,

    description:
        adminProduct.description || ""

};

            }

        }

    }

} catch (error) {

    console.log(
        "Could not load admin product.",
        error
    );

}


        /* ==========================================
           ELEMENT
           ========================================== */

        const productDetail =
            document.getElementById(
                "productDetail"
            );


        /* ==========================================
           CART COUNT
           ========================================== */

        const productCartCount =
            document.getElementById(
                "productCartCount"
            );


        /* ==========================================
           FORMAT CART COUNT
           ========================================== */

        function updateProductCartCount() {

            try {

                const savedCart =
                    localStorage.getItem(
                        "varnamCart"
                    );


                if (!savedCart) {

                    productCartCount.textContent =
                        "0";

                    return;

                }


                const cart =
                    JSON.parse(
                        savedCart
                    );


                const totalItems =
                    cart.reduce(
                        function(total, item) {

                            return total +
                                (
                                    Number(
                                        item.quantity
                                    ) || 0
                                );

                        },
                        0
                    );


                productCartCount.textContent =
                    totalItems;

            }

            catch (error) {

                productCartCount.textContent =
                    "0";

            }

        }


        /* ==========================================
           PRODUCT NOT FOUND
           ========================================== */

        if (!selectedProduct) {

            productDetail.innerHTML = `

                <div class="product-not-found">

                    <h2>
                        Product Not Found
                    </h2>

                    <a
                        href="index.html"
                        class="back-shop-button"
                    >
                        Back to Sarees
                    </a>

                </div>

            `;

        }


        /* ==========================================
           DISPLAY PRODUCT
           ========================================== */

        else {

            productDetail.innerHTML = `

                <div class="product-image-box">

                    <img
                        class="product-detail-image"
                        src="${selectedProduct.image}"
                        alt="${selectedProduct.name}"
                    >

                </div>


                <div class="product-info">

                    <p class="product-category">

                        ${selectedProduct.type}

                    </p>


                    <h1 class="product-name">

                        ${selectedProduct.name}

                    </h1>


                    <div class="product-price">

                        ${formatPrice(
                            selectedProduct.price
                        )}

                    </div>


                    <span class="product-stock">

                        ✓ In Stock

                    </span>


                    <p class="product-description">

    ${selectedProduct.description ||
        "Beautifully crafted saree from Varnam Silks."}

</p>


                    <div class="quantity-section">

                        <label class="quantity-label">

                            Quantity

                        </label>


                        <div class="quantity-control">

                            <button
                                type="button"
                                id="minusButton"
                            >
                                −
                            </button>


                            <span
                                id="quantityValue"
                            >
                                1
                            </span>


                            <button
                                type="button"
                                id="plusButton"
                            >
                                +
                            </button>

                        </div>

                    </div>


                    <div class="product-actions">

                        <button
                            type="button"
                            class="add-cart-button"
                            id="addCartButton"
                        >
                            Add to Cart
                        </button>


                        <button
                            type="button"
                            class="buy-now-button"
                            id="buyNowButton"
                        >
                            Buy Now
                        </button>

                    </div>


                    <div class="delivery-card">

                        <h3>
                            🚚 Delivery Information
                        </h3>

                        <p>

                            Delivery availability
                            and charges will be
                            confirmed during checkout.

                        </p>

                    </div>

                </div>

            `;

        }


        /* ==========================================
           QUANTITY
           ========================================== */

        let quantity = 1;


        const quantityValue =
            document.getElementById(
                "quantityValue"
            );


        const minusButton =
            document.getElementById(
                "minusButton"
            );


        const plusButton =
            document.getElementById(
                "plusButton"
            );


        if (
            quantityValue &&
            minusButton &&
            plusButton
        ) {

            minusButton.addEventListener(
                "click",
                function() {

                    if (quantity > 1) {

                        quantity--;

                        quantityValue.textContent =
                            quantity;

                    }

                }
            );


            plusButton.addEventListener(
                "click",
                function() {

                    quantity++;

                    quantityValue.textContent =
                        quantity;

                }
            );

        }


        /* ==========================================
           GET CART
           ========================================== */

        function getCart() {

            try {

                const savedCart =
                    localStorage.getItem(
                        "varnamCart"
                    );


                if (!savedCart) {

                    return [];

                }


                const cart =
                    JSON.parse(
                        savedCart
                    );


                if (
                    !Array.isArray(cart)
                ) {

                    return [];

                }


                return cart;

            }

            catch (error) {

                return [];

            }

        }


        /* ==========================================
           SAVE CART
           ========================================== */

        function saveCart(cart) {

            localStorage.setItem(
                "varnamCart",
                JSON.stringify(cart)
            );

        }
              /* ==========================================
           ADD PRODUCT TO CART
           ========================================== */

        function addProductToCart(
            goToCart
        ) {

            if (!selectedProduct) {

                return;

            }


            const cart =
                getCart();


            const existing =
                cart.find(
                    item =>
                        item.id ===
                        selectedProduct.id
                );


            if (existing) {

                existing.quantity =
                    (
                        Number(
                            existing.quantity
                        ) || 0
                    ) + quantity;

            }

            else {

                cart.push({

                    id:
                        selectedProduct.id,

                    name:
                        selectedProduct.name,

                    price:
                        selectedProduct.price,

                    image:
                        selectedProduct.image,

                    category:
                        selectedProduct.type,

                    quantity:
                        quantity

                });

            }


            saveCart(cart);


            updateProductCartCount();


            if (goToCart) {

                window.location.href =
                    "cart.html";

            }

        }


        /* ==========================================
           ADD TO CART BUTTON
           ========================================== */

        const addCartButton =
            document.getElementById(
                "addCartButton"
            );


        if (addCartButton) {

            addCartButton.addEventListener(
                "click",
                function() {

                    addProductToCart(false);


                    const originalText =
                        "Add to Cart";


                    addCartButton.textContent =
                        "✓ Added to Cart";


                    setTimeout(
                        function() {

                            addCartButton.textContent =
                                originalText;

                        },
                        1500
                    );

                }
            );

        }


        /* ==========================================
           BUY NOW BUTTON
           ========================================== */

        const buyNowButton =
            document.getElementById(
                "buyNowButton"
            );


        if (buyNowButton) {

            buyNowButton.addEventListener(
                "click",
                function() {

                    addProductToCart(true);

                }
            );

        }


        /* ==========================================
           CART BUTTON
           ========================================== */

        const productCartButton =
            document.getElementById(
                "productCartButton"
            );


        if (productCartButton) {

            productCartButton.addEventListener(
                "click",
                function() {

                    window.location.href =
                        "cart.html";

                }
            );

        }


        /* ==========================================
           BACK BUTTON
           ========================================== */

        const backButton =
            document.getElementById(
                "backButton"
            );


        const backTopButton =
            document.getElementById(
                "backTopButton"
            );


        if (backButton) {

            backButton.addEventListener(
                "click",
                function() {

                    window.location.href =
                        "index.html";

                }
            );

        }


        if (backTopButton) {

            backTopButton.addEventListener(
                "click",
                function() {

                    window.location.href =
                        "index.html";

                }
            );

        }


        /* ==========================================
           INITIAL CART COUNT
           ========================================== */

        updateProductCartCount();

    </script>


</body>

</html>
