<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Varnam Silks - Orders</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f8f2ed;
            color: #321039;
        }


        /* =========================
           HEADER
        ========================= */

        .admin-header {

            height: 64px;

            background: #321039;

            display: flex;
            align-items: center;

            padding: 0 16px;

            color: white;

            position: sticky;
            top: 0;

            z-index: 100;
        }


        .back-btn {

            width: 38px;
            height: 38px;

            border: none;
            background: transparent;

            color: white;

            font-size: 25px;

            cursor: pointer;

            margin-right: 8px;
        }


        .header-title {

            flex: 1;
        }


        .header-title h1 {

            font-size: 17px;

            letter-spacing: 1px;
        }


        .header-title span {

            display: block;

            color: #d7a849;

            font-size: 9px;

            letter-spacing: 1.5px;

            margin-top: 3px;
        }


        /* =========================
           PAGE
        ========================= */

        .page {

            max-width: 1000px;

            margin: auto;

            padding: 20px 16px 40px;
        }


        .page-heading {

            margin-bottom: 20px;
        }


        .page-heading h2 {

            font-size: 22px;

            margin-bottom: 5px;

            color: #321039;
        }


        .page-heading p {

            font-size: 12px;

            color: #777;
        }


        /* =========================
           FILTERS
        ========================= */

        .filter-container {

            display: flex;

            gap: 8px;

            overflow-x: auto;

            padding-bottom: 5px;

            margin-bottom: 18px;
        }


        .filter-btn {

            flex-shrink: 0;

            border: 1px solid #ded3cc;

            background: white;

            color: #555;

            padding: 9px 15px;

            border-radius: 20px;

            font-size: 11px;

            cursor: pointer;
        }


        .filter-btn.active {

            background: #321039;

            color: white;

            border-color: #321039;
        }


        /* =========================
           ORDER CARD
        ========================= */

        .orders-container {

            display: flex;

            flex-direction: column;

            gap: 14px;
        }


        .order-card {

            background: white;

            border: 1px solid #eadfd8;

            border-radius: 10px;

            padding: 16px;

            box-shadow:
                0 3px 12px
                rgba(50, 16, 57, 0.06);
        }


        .order-top {

            display: flex;

            justify-content: space-between;

            align-items: flex-start;

            gap: 10px;

            padding-bottom: 13px;

            border-bottom: 1px solid #eee;
        }


        .order-id {

            font-size: 14px;

            font-weight: bold;

            color: #321039;

            margin-bottom: 5px;
        }


        .order-date {

            font-size: 10px;

            color: #888;
        }


        .status {

            display: inline-block;

            padding: 5px 9px;

            border-radius: 20px;

            font-size: 9px;

            background: #f4ead4;

            color: #8a6418;

            white-space: nowrap;
        }


        /* =========================
           CUSTOMER
        ========================= */

        .customer-section {

            padding: 13px 0;

            border-bottom: 1px solid #eee;
        }


        .customer-label {

            font-size: 9px;

            text-transform: uppercase;

            letter-spacing: 0.5px;

            color: #999;

            margin-bottom: 5px;
        }


        .customer-name {

            font-size: 13px;

            font-weight: bold;

            color: #321039;

            margin-bottom: 3px;
        }


        .customer-phone {

            font-size: 11px;

            color: #777;
        }


        /* =========================
           ORDER INFO
        ========================= */

        .order-info {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 8px;

            padding: 13px 0;

            border-bottom: 1px solid #eee;
        }


        .info-box {

            background: #f8f2ed;

            border-radius: 7px;

            padding: 9px;

        }


        .info-label {

            display: block;

            font-size: 9px;

            color: #888;

            margin-bottom: 4px;
        }


        .info-value {

            font-size: 12px;

            font-weight: bold;

            color: #321039;
        }


        /* =========================
           ITEMS
        ========================= */

        .items-section {

            padding: 13px 0;

            border-bottom: 1px solid #eee;
        }


        .items-title {

            font-size: 10px;

            color: #888;

            margin-bottom: 8px;

            text-transform: uppercase;
        }


        .item-row {

            display: flex;

            align-items: center;

            gap: 9px;

            margin-bottom: 8px;
        }


        .item-row:last-child {

            margin-bottom: 0;
        }


        .item-image {

            width: 42px;
            height: 52px;

            object-fit: cover;

            border-radius: 5px;

            border: 1px solid #eee;

            background: #f8f2ed;
        }


        .item-details {

            flex: 1;

            min-width: 0;
        }


        .item-name {

            font-size: 11px;

            font-weight: bold;

            color: #321039;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        .item-quantity {

            font-size: 9px;

            color: #888;

            margin-top: 3px;
        }


        .item-price {

            font-size: 11px;

            font-weight: bold;

            color: #321039;
        }


        /* =========================
           FOOTER
        ========================= */

        .order-footer {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 10px;

            padding-top: 13px;
        }


        .total-label {

            font-size: 9px;

            color: #888;

            margin-bottom: 3px;
        }


        .total-price {

            font-size: 17px;

            font-weight: bold;

            color: #321039;
        }


        .action-buttons {

            display: flex;

            gap: 7px;
        }


        .view-btn,
        .status-btn {

            border-radius: 6px;

            padding: 9px 11px;

            font-size: 10px;

            cursor: pointer;
        }


        .view-btn {

            background: white;

            border: 1px solid #321039;

            color: #321039;
        }


        .status-btn {

            background: #321039;

            border: 1px solid #321039;

            color: white;
        }


        /* =========================
           EMPTY
        ========================= */

        .empty-orders {

            background: white;

            border: 1px solid #eadfd8;

            border-radius: 10px;

            padding: 45px 20px;

            text-align: center;
        }


        .empty-icon {

            font-size: 35px;

            margin-bottom: 12px;
        }


        .empty-orders h3 {

            font-size: 16px;

            margin-bottom: 5px;
        }


        .empty-orders p {

            font-size: 11px;

            color: #888;
        }


        /* =========================
           STATUS COLORS
        ========================= */

        .status.confirmed {

            background: #e8f3ff;

            color: #25639b;
        }


        .status.packed {

            background: #f0e8ff;

            color: #6841a5;
        }


        .status.shipped {

            background: #e6f6ee;

            color: #28764c;
        }


        .status.out-for-delivery {

            background: #fff0df;

            color: #a15d19;
        }


        .status.delivered {

            background: #e2f5e7;

            color: #24713b;
        }


        /* =========================
           DESKTOP
        ========================= */

        @media (min-width: 700px) {

            .page {

                padding: 28px;
            }

            .admin-header {

                padding: 0 28px;
            }

            .order-card {

                padding: 20px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <header class="admin-header">

        <button
            class="back-btn"
            id="backBtn"
            aria-label="Back"
        >
            ←
        </button>


        <div class="header-title">

            <h1>
                VARNAM SILKS
            </h1>

            <span>
                ORDER MANAGEMENT
            </span>

        </div>

    </header>


    <!-- =========================
         MAIN
    ========================= -->

    <main class="page">


        <section class="page-heading">

            <h2>
                Orders
            </h2>

            <p>
                Manage customer orders and delivery status
            </p>

        </section>


        <!-- =========================
             FILTERS
        ========================= -->

        <div class="filter-container">

            <button
                class="filter-btn active"
                data-filter="all"
            >
                All
            </button>

            <button
                class="filter-btn"
                data-filter="Order Placed"
            >
                Pending
            </button>

            <button
                class="filter-btn"
                data-filter="Confirmed"
            >
                Confirmed
            </button>

            <button
                class="filter-btn"
                data-filter="Packed"
            >
                Packed
            </button>

          <button
    class="filter-btn"
    data-filter="Shipped"
>
    Shipped
</button>

<button
    class="filter-btn"
    data-filter="Out for Delivery"
>
    Out for Delivery
</button>

<button
    class="filter-btn"
    data-filter="Delivered"
>
    Delivered
</button>
        </div>


        <!-- =========================
             ORDERS
        ========================= -->

        <div
            class="orders-container"
            id="ordersContainer"
        >

            <!-- Orders will load here -->

        </div>


    </main>


    <!-- PART 2 GOES HERE -->
  <script>

/* ==========================================
   ADMIN ORDERS
========================================== */


/* ==========================================
   GET ORDERS
========================================== */

function getOrders() {

    try {

        const savedOrders =
            localStorage.getItem(
                "varnamOrders"
            );

        if (!savedOrders) {
            return [];
        }

        const orders =
            JSON.parse(savedOrders);

        return Array.isArray(orders)
            ? orders
            : [];

    } catch (error) {

        return [];

    }

}


/* ==========================================
   SAVE ORDERS
========================================== */

function saveOrders(orders) {

    localStorage.setItem(
        "varnamOrders",
        JSON.stringify(orders)
    );

}


/* ==========================================
   PRICE
========================================== */

function formatPrice(amount) {

    return "₹" +
        Number(amount || 0).toLocaleString(
            "en-IN"
        );

}


/* ==========================================
   DATE
========================================== */

function formatDate(dateValue) {

    if (!dateValue) {
        return "-";
    }

    const date =
        new Date(dateValue);

    if (isNaN(date.getTime())) {
        return "-";
    }

    return date.toLocaleDateString(
        "en-IN",
        {
            day: "2-digit",
            month: "short",
            year: "numeric"
        }
    );

}


/* ==========================================
   STATUS CLASS
========================================== */

function getStatusClass(status) {

    if (!status) {
        return "";
    }

    return status
        .toLowerCase()
        .replace(/ /g, "-");

}


/* ==========================================
   CUSTOMER NAME
========================================== */

function getCustomerName(order) {

    if (
        order.customer &&
        order.customer.name
    ) {

        return order.customer.name;

    }

    if (order.name) {
        return order.name;
    }

    return "Customer";

}


/* ==========================================
   CUSTOMER PHONE
========================================== */

function getCustomerPhone(order) {

    if (
        order.customer &&
        order.customer.phone
    ) {

        return order.customer.phone;

    }

    if (order.phone) {
        return order.phone;
    }

    return "Phone not available";

}


/* ==========================================
   LOAD ORDERS
========================================== */

function loadOrders(filter = "all") {

    const orders =
        getOrders();

    const container =
        document.getElementById(
            "ordersContainer"
        );


    /* ----------------------------------------
       NO ORDERS
    ---------------------------------------- */

    if (orders.length === 0) {

        container.innerHTML = `

            <div class="empty-orders">

                <div class="empty-icon">
                    📦
                </div>

                <h3>
                    No Orders Yet
                </h3>

                <p>
                    Customer orders will appear here.
                </p>

            </div>

        `;

        return;

    }


    /* ----------------------------------------
       FILTER
    ---------------------------------------- */

    let filteredOrders = orders;

    if (filter !== "all") {

        filteredOrders =
            orders.filter(
                function(order) {

                    const status =
                        order.status ||
                        "Order Placed";

                    return status === filter;

                }
            );

    }


    /* ----------------------------------------
       FILTER HAS NO RESULTS
    ---------------------------------------- */

    if (filteredOrders.length === 0) {

        container.innerHTML = `

            <div class="empty-orders">

                <div class="empty-icon">
                    🔍
                </div>

                <h3>
                    No Orders Found
                </h3>

                <p>
                    There are no orders in this category.
                </p>

            </div>

        `;

        return;

    }


    let html = "";


    /* ----------------------------------------
       CREATE ORDER CARDS
    ---------------------------------------- */

    filteredOrders.forEach(
        function(order) {

            const items =
                Array.isArray(order.items)
                    ? order.items
                    : [];


            let itemsHTML = "";


            items.forEach(
                function(item) {

                    itemsHTML += `

                        <div class="item-row">

                            <img
                                class="item-image"
                                src="${item.image || ""}"
                                alt="${item.name || "Product"}"
                            >

                            <div class="item-details">

                                <div class="item-name">
                                    ${item.name || "Product"}
                                </div>

                                <div class="item-quantity">
                                    Quantity:
                                    ${item.quantity || 1}
                                </div>

                            </div>

                            <div class="item-price">

                                ${formatPrice(
                                    Number(item.price || 0) *
                                    Number(item.quantity || 1)
                                )}

                            </div>

                        </div>

                    `;

                }
            );


            if (itemsHTML === "") {

                itemsHTML = `

                    <div
                        style="
                            font-size:11px;
                            color:#888;
                        "
                    >
                        No product information
                    </div>

                `;

            }


            const customerName =
                getCustomerName(order);

            const customerPhone =
                getCustomerPhone(order);


            const status =
                order.status ||
                "Order Placed";


            html += `

                <div class="order-card">

                    <!-- ORDER TOP -->

                    <div class="order-top">

                        <div>

                            <div class="order-id">

                                ${order.orderId || "Order"}

                            </div>

                            <div class="order-date">

                                ${formatDate(
                                    order.createdAt
                                )}

                            </div>

                        </div>


                        <span
                            class="status ${getStatusClass(status)}"
                        >

                            ${status}

                        </span>

                    </div>


                    <!-- CUSTOMER -->

                    <div class="customer-section">

                        <div class="customer-label">
                            Customer
                        </div>

                        <div class="customer-name">

                            ${customerName}

                        </div>

                        <div class="customer-phone">

                            ${customerPhone}

                        </div>

                    </div>


                    <!-- ORDER INFO -->

                    <div class="order-info">

                        <div class="info-box">

                            <span class="info-label">
                                Items
                            </span>

                            <span class="info-value">

                                ${items.length}

                            </span>

                        </div>


                        <div class="info-box">

                            <span class="info-label">
                                Payment
                            </span>

                            <span class="info-value">

                                ${order.paymentMethod ||
                                  "COD"}

                            </span>

                        </div>


                        <div class="info-box">

                            <span class="info-label">
                                Delivery
                            </span>

                            <span class="info-value">

                                ${order.deliveryCharge
                                    ? formatPrice(
                                        order.deliveryCharge
                                      )
                                    : "Free"}

                            </span>

                        </div>

                    </div>


                    <!-- ITEMS -->

                    <div class="items-section">

                        <div class="items-title">
                            Ordered Items
                        </div>

                        ${itemsHTML}

                    </div>


                    <!-- FOOTER -->

                    <div class="order-footer">

                        <div>

                            <div class="total-label">
                                Total Amount
                            </div>

                            <div class="total-price">

                                ${formatPrice(
                                    order.total
                                )}

                            </div>

                        </div>


                        <div class="action-buttons">

                            <button
                                class="view-btn"
                                onclick="viewOrder(
                                    '${order.orderId || ""}'
                                )"
                            >
                                View
                            </button>


                            <button
                                class="status-btn"
                                onclick="changeStatus(
                                    '${order.orderId || ""}'
                                )"
                            >
                                Update Status
                            </button>

                        </div>

                    </div>

                </div>

            `;

        }
    );


    container.innerHTML =
        html;

}


/* ==========================================
   VIEW ORDER
========================================== */

function viewOrder(orderId) {

    if (!orderId) {
        return;
    }

    window.location.href =
        "order-details.html?id=" +
        encodeURIComponent(orderId);

}


/* ==========================================
   UPDATE ORDER STATUS
========================================== */

function changeStatus(orderId) {

    const orders =
        getOrders();


    const orderIndex =
        orders.findIndex(
            function(order) {

                return String(order.orderId) ===
                       String(orderId);

            }
        );


    if (orderIndex === -1) {

        alert(
            "Order not found."
        );

        return;

    }


    const currentStatus =
        orders[orderIndex].status ||
        "Order Placed";


    const statusList = [

        "Order Placed",

        "Confirmed",

        "Packed",

        "Shipped",

        "Out for Delivery",

        "Delivered"

    ];


    const currentIndex =
        statusList.indexOf(
            currentStatus
        );


    let nextIndex =
        currentIndex + 1;


    /* -----------------------------------------
       UNKNOWN STATUS
    ----------------------------------------- */

    if (
        currentIndex === -1
    ) {

        nextIndex = 1;

    }


    /* -----------------------------------------
       ALREADY DELIVERED
    ----------------------------------------- */

    if (
        nextIndex >=
        statusList.length
    ) {

        alert(
            "This order is already Delivered."
        );

        return;

    }


    const nextStatus =
        statusList[nextIndex];


    /* -----------------------------------------
       CONFIRM CHANGE
    ----------------------------------------- */

    const confirmChange =
        confirm(

            "Change order status from\n\n" +

            currentStatus +

            "\n\nTo\n\n" +

            nextStatus +

            "?"

        );


    if (!confirmChange) {

        return;

    }


    /* -----------------------------------------
       UPDATE STATUS
    ----------------------------------------- */

    orders[orderIndex].status =
        nextStatus;


    /* -----------------------------------------
       SAVE
    ----------------------------------------- */

    saveOrders(
        orders
    );


    /* -----------------------------------------
       REFRESH CURRENT FILTER
    ----------------------------------------- */

    loadOrders(
        getActiveFilter()
    );


    alert(

        "Order status updated to\n\n" +

        nextStatus

    );

}

/* ==========================================
   ACTIVE FILTER
========================================== */

function getActiveFilter() {

    const activeButton =
        document.querySelector(
            ".filter-btn.active"
        );


    if (!activeButton) {
        return "all";
    }


    return activeButton.dataset.filter;

}


/* ==========================================
   FILTER BUTTONS
========================================== */

const filterButtons =
    document.querySelectorAll(
        ".filter-btn"
    );


filterButtons.forEach(
    function(button) {

        button.addEventListener(
            "click",
            function() {

                filterButtons.forEach(
                    function(btn) {

                        btn.classList.remove(
                            "active"
                        );

                    }
                );


                this.classList.add(
                    "active"
                );


                loadOrders(
                    this.dataset.filter
                );

            }
        );

    }
);


/* ==========================================
   BACK BUTTON
========================================== */

document
    .getElementById("backBtn")
    .addEventListener(
        "click",
        function() {

            window.location.href =
                "admin.html";

        }
    );


/* ==========================================
   START
========================================== */

loadOrders();

      </script>


</body>

</html>
