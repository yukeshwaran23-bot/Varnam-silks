<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Order Details | VARNAM SILKS
    </title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: Arial, sans-serif;
            background: #f8f2ed;
            color: #321039;
        }


        .topbar {
            height: 64px;
            background: #321039;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            position: sticky;
            top: 0;
            z-index: 100;
        }


        .back-btn {
            border: none;
            background: transparent;
            color: #ffffff;
            font-size: 26px;
            cursor: pointer;
        }


        .brand {
            text-align: center;
        }


        .brand h1 {
            font-size: 18px;
            letter-spacing: 2px;
        }


        .brand p {
            font-size: 8px;
            color: #d7a849;
            letter-spacing: 1.5px;
            margin-top: 3px;
        }


        .top-space {
            width: 30px;
        }


        .page {
            max-width: 600px;
            margin: auto;
            padding: 20px 15px 40px;
        }


        .page-title {
            text-align: center;
            margin-bottom: 20px;
        }


        .page-title h2 {
            font-size: 24px;
            color: #321039;
        }


        .page-title p {
            font-size: 13px;
            color: #777;
            margin-top: 5px;
        }


        .card {
            background: #ffffff;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 15px;
            box-shadow:
                0 3px 12px
                rgba(50, 16, 57, 0.08);
        }


        .card-title {
            font-size: 16px;
            font-weight: bold;
            color: #321039;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }


        .status-box {
            background: #f4fbf5;
            border: 1px solid #b8dfbe;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            margin-bottom: 15px;
        }


        .status-icon {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #2e8b57;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto;
            font-size: 22px;
        }


        .status-text {
            color: #267344;
            font-weight: bold;
            margin-top: 8px;
        }


        .order-id {
            font-size: 13px;
            color: #666;
            margin-top: 5px;
        }


        .detail-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 9px 0;
            font-size: 14px;
        }


        .detail-label {
            color: #777;
        }


        .detail-value {
            color: #321039;
            font-weight: 600;
            text-align: right;
        }


        .address {
            background: #fffaf5;
            border-radius: 10px;
            padding: 13px;
            line-height: 1.6;
            font-size: 14px;
            color: #444;
        }


        .product {
            display: flex;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }


        .product:last-child {
            border-bottom: none;
        }


        .product-image {
            width: 75px;
            height: 90px;
            object-fit: cover;
            border-radius: 8px;
            background: #f1e8e2;
        }


        .product-info {
            flex: 1;
        }


        .product-name {
            font-size: 14px;
            font-weight: bold;
            color: #321039;
            line-height: 1.4;
        }


        .product-type {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }


        .product-qty {
            font-size: 12px;
            color: #666;
            margin-top: 7px;
        }


        .product-price {
            font-size: 14px;
            font-weight: bold;
            color: #321039;
            margin-top: 7px;
        }


        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 14px;
        }


        .summary-row span:first-child {
            color: #777;
        }


        .summary-row span:last-child {
            font-weight: 600;
            color: #321039;
        }


        .total-row {
            border-top: 1px solid #ddd;
            margin-top: 8px;
            padding-top: 14px;
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            color: #321039;
        }


        .free {
            color: #2e8b57 !important;
        }


        .button {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 10px;
            background: #321039;
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }


        .button:hover {
            opacity: 0.92;
        }


        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #777;
        }


        .empty h2 {
            color: #321039;
            margin-bottom: 8px;
        }


        @media (min-width: 700px) {

            .page {
                padding-top: 30px;
            }


            .topbar {
                padding: 0 30px;
            }

        }

    </style>

</head>


<body>


    <header class="topbar">


        <button
            class="back-btn"
            onclick="history.back()"
        >
            ←
        </button>


        <div class="brand">

            <h1>
                VARNAM SILKS
            </h1>

            <p>
                SAREES THAT SPEAK ELEGANCE
            </p>

        </div>


        <div class="top-space"></div>


    </header>



    <main class="page">


        <div class="page-title">

            <h2>
                Order Details
            </h2>

            <p>
                Your Varnam Silks order information
            </p>

        </div>


        <div id="orderContainer">

            <!-- Order details will load here -->

        </div>


    </main>



    <script>


        const orderContainer =
            document.getElementById(
                "orderContainer"
            );



        /*
         * GET SELECTED ORDER
         *
         * Example:
         *
         * order-details.html?id=VS123456
         *
         * The ID is taken from the URL.
         *
         * Then the matching order is found
         * inside varnamOrders.
         */

        function getOrder() {


            const urlParams =
                new URLSearchParams(
                    window.location.search
                );


            const orderId =
                urlParams.get("id");


            if (!orderId) {

    const lastOrder =
        localStorage.getItem(
            "varnamLastOrder"
        );

    if (!lastOrder) {
        return null;
    }

    try {
        return JSON.parse(lastOrder);
    } catch (error) {
        return null;
    }

            }


            const savedOrders =
                localStorage.getItem(
                    "varnamOrders"
                );


            if (!savedOrders) {

                return null;

            }


            let orders;


            try {

                orders =
                    JSON.parse(
                        savedOrders
                    );

            } catch (error) {

                return null;

            }


            if (!Array.isArray(orders)) {

                return null;

            }


            const order =
                orders.find(
                    function(item) {

                        return String(
                            item.orderId
                        ) === String(
                            orderId
                        );

                    }
                );


            return order || null;

        }



        function formatPrice(price) {


            return (
                "₹" +
                Number(price)
                    .toLocaleString("en-IN")
            );


        }



        function showEmptyOrder() {


            orderContainer.innerHTML = `

                <div class="card empty">

                    <h2>
                        No Order Found
                    </h2>

                    <p>
                        We could not find your
                        order details.
                    </p>


                    <button
                        class="button"
                        onclick="
                            window.location.href='index.html'
                        "
                    >
                        Continue Shopping
                    </button>

                </div>

            `;


        }



        function loadOrder() {


            const order =
                getOrder();


            if (!order) {

                showEmptyOrder();

                return;

            }


            const customer =
                order.customer || {};


            const items =
                order.items || [];


            let itemsHTML = "";


            items.forEach(
                function(item) {


                    const quantity =
                        Number(
                            item.quantity
                        ) || 1;


                    const itemTotal =
                        Number(
                            item.price
                        ) * quantity;


                    itemsHTML += `

                        <div class="product">


                            <img
                                class="product-image"
                                src="${item.image || ""}"
                                alt="${item.name || "Product"}"
                            >


                            <div
                                class="product-info"
                            >


                                <div
                                    class="product-name"
                                >
                                    ${item.name || "Product"}
                                </div>


                                <div
                                    class="product-type"
                                >
                                    ${item.category || "Saree"}
                                </div>


                                <div
                                    class="product-qty"
                                >
                                    Quantity:
                                    ${quantity}
                                </div>


                                <div
                                    class="product-price"
                                >
                                    ${formatPrice(itemTotal)}
                                </div>


                            </div>


                        </div>

                    `;


                }
            );



            orderContainer.innerHTML = `


                <!-- STATUS -->

                <div class="status-box">


                    <div class="status-icon">
                        ✓
                    </div>


                    <div class="status-text">

                        ${
                            order.status ||
                            "Order Placed"
                        }

                    </div>


                    <div class="order-id">

                        Order ID:
                        ${order.orderId || "-"}

                    </div>


                </div>



                <!-- CUSTOMER DETAILS -->

                <div class="card">


                    <div class="card-title">

                        Customer Details

                    </div>


                    <div class="detail-row">


                        <span class="detail-label">

                            Full Name

                        </span>


                        <span class="detail-value">

                            ${
                                customer.name ||
                                "-"
                            }

                        </span>


                    </div>



                    <div class="detail-row">


                        <span class="detail-label">

                            Mobile

                        </span>


                        <span class="detail-value">

                            ${
                                customer.phone ||
                                "-"
                            }

                        </span>


                    </div>


                </div>



                <!-- DELIVERY ADDRESS -->

                <div class="card">


                    <div class="card-title">

                        Delivery Address

                    </div>


                    <div class="address">


                        ${
                            customer.address ||
                            "-"
                        }

                        <br>


                        ${
                            customer.city ||
                            "-"
                        }

                        -

                        ${
                            customer.pincode ||
                            "-"
                        }

                        <br>


                        ${
                            customer.state ||
                            "-"
                        }


                    </div>


                </div>



                <!-- ORDERED ITEMS -->

                <div class="card">


                    <div class="card-title">

                        Ordered Items

                    </div>


                    ${
                        itemsHTML ||
                        "<p>No items found.</p>"
                    }


                </div>



                <!-- PAYMENT -->

                <div class="card">


                    <div class="card-title">

                        Payment & Total

                    </div>



                    <div class="summary-row">


                        <span>

                            Subtotal

                        </span>


                        <span>

                            ${
                                formatPrice(
                                    order.subtotal || 0
                                )
                            }

                        </span>


                    </div>



                    <div class="summary-row">


                        <span>

                            Delivery

                        </span>


                        <span
                            class="${
                                Number(
                                    order.delivery
                                ) === 0
                                    ? "free"
                                    : ""
                            }"
                        >


                            ${
                                Number(
                                    order.delivery
                                ) === 0

                                ? "FREE"

                                : formatPrice(
                                    order.delivery || 0
                                )
                            }


                        </span>


                    </div>



                    <div class="summary-row">


                        <span>

                            Payment

                        </span>


                        <span>

                            ${
                                order.paymentMethod ||
                                "Cash on Delivery"
                            }

                        </span>


                    </div>



                    <div class="total-row">


                        <span>

                            Total

                        </span>


                        <span>

                            ${
                                formatPrice(
                                    order.total || 0
                                )
                            }

                        </span>


                    </div>


                </div>



                <!-- CONTINUE SHOPPING -->

                <button
                    class="button"
                    onclick="
                        window.location.href='index.html'
                    "
                >

                    Continue Shopping

                </button>


            `;


        }



        loadOrder();


    </script>


</body>

</html>
