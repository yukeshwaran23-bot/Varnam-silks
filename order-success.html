<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Order Confirmed | Varnam Silks
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        /* ==========================================
           ORDER SUCCESS PAGE
           ========================================== */

        .success-page {

            max-width: 900px;

            margin: auto;

            padding: 35px 16px 70px;

        }


        /* ==========================================
           SUCCESS CARD
           ========================================== */

        .success-card {

            background: var(--white);

            border: 1px solid var(--border);

            border-radius: 8px;

            padding: 30px 20px;

            text-align: center;

        }


        /* ==========================================
           SUCCESS ICON
           ========================================== */

        .success-icon {

            width: 70px;

            height: 70px;

            margin: 0 auto 18px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            background: #edf7ef;

            color: #356641;

            font-family: Arial, sans-serif;

            font-size: 36px;

            font-weight: 700;

        }


        /* ==========================================
           TITLE
           ========================================== */

        .success-label {

            color: var(--gold);

            font-size: 10px;

            letter-spacing: 3px;

            margin-bottom: 8px;

        }


        .success-card h1 {

            color: var(--maroon);

            font-size: 30px;

            font-weight: 500;

            margin-bottom: 10px;

        }


        .success-message {

            color: var(--muted);

            font-family: Arial, sans-serif;

            font-size: 13px;

            line-height: 1.7;

            margin-bottom: 25px;

        }


        /* ==========================================
           ORDER ID
           ========================================== */

        .order-id-box {

            padding: 15px;

            margin-bottom: 20px;

            background: var(--cream);

            border: 1px solid var(--border);

            border-radius: 5px;

        }


        .order-id-label {

            color: var(--muted);

            font-family: Arial, sans-serif;

            font-size: 10px;

            margin-bottom: 6px;

        }


        .order-id {

            color: var(--maroon);

            font-family: Arial, sans-serif;

            font-size: 16px;

            font-weight: 700;

        }


        /* ==========================================
           DETAILS
           ========================================== */

        .success-details {

            text-align: left;

            border-top: 1px solid var(--border);

        }


        .detail-row {

            display: flex;

            justify-content: space-between;

            gap: 20px;

            padding: 13px 0;

            border-bottom: 1px solid var(--border);

            font-family: Arial, sans-serif;

            font-size: 12px;

        }


        .detail-row span:first-child {

            color: var(--muted);

        }


        .detail-row span:last-child {

            color: var(--text);

            font-weight: 600;

            text-align: right;

        }


        /* ==========================================
           TOTAL
           ========================================== */

        .success-total {

            display: flex;

            justify-content: space-between;

            padding: 18px 0;

            color: var(--maroon);

            font-family: Arial, sans-serif;

            font-size: 18px;

            font-weight: 700;

        }


        /* ==========================================
           BUTTONS
           ========================================== */

        .success-actions {

            display: grid;

            grid-template-columns: 1fr;

            gap: 10px;

            margin-top: 10px;

        }


        .success-actions button {

            width: 100%;

            height: 48px;

            border-radius: 4px;

            font-size: 12px;

        }


        .continue-shopping-btn {

            border: 1px solid var(--maroon);

            background: transparent;

            color: var(--maroon);

        }


        .view-order-btn {

            border: 1px solid var(--maroon);

            background: var(--maroon);

            color: var(--white);

        }


        /* ==========================================
           DESKTOP
           ========================================== */

        @media (min-width: 700px) {

            .success-page {

                padding: 55px 25px 90px;

            }


            .success-card {

                max-width: 650px;

                margin: auto;

                padding: 45px 40px;

            }


            .success-card h1 {

                font-size: 38px;

            }


            .success-actions {

                grid-template-columns: 1fr 1fr;

            }

        }

    </style>

</head>


<body>


    <!-- ==========================================
         TOPBAR
         ========================================== -->

    <header class="topbar">


        <button
            class="icon-btn"
            id="backButton"
        >
            ←
        </button>


        <div class="brand">

            <div class="brand-name">
                VARNAM SILKS
            </div>

            <div class="brand-tagline">
                SAREES THAT SPEAK ELEGANCE
            </div>

        </div>


        <div style="width:40px;"></div>


    </header>


    <!-- ==========================================
         SUCCESS PAGE
         ========================================== -->

    <main class="success-page">


        <section class="success-card">


            <div class="success-icon">

                ✓

            </div>


            <p class="success-label">

                ORDER CONFIRMED

            </p>


            <h1>

                Order Placed Successfully

            </h1>


            <p class="success-message">

                Thank you for shopping with
                Varnam Silks. Your order has
                been received successfully.

            </p>


            <!-- ORDER ID -->

            <div class="order-id-box">

                <div class="order-id-label">

                    ORDER ID

                </div>


                <div
                    class="order-id"
                    id="orderId"
                >

                    --

                </div>

            </div>


            <!-- DETAILS -->

            <div class="success-details">


                <div class="detail-row">

                    <span>
                        Customer
                    </span>

                    <span id="customerName">
                        --
                    </span>

                </div>


                <div class="detail-row">

                    <span>
                        Mobile
                    </span>

                    <span id="customerPhone">
                        --
                    </span>

                </div>


                <div class="detail-row">

                    <span>
                        Payment
                    </span>

                    <span id="paymentMethod">
                        --
                    </span>

                </div>


                <div class="detail-row">

                    <span>
                        Items
                    </span>

                    <span id="itemCount">
                        0
                    </span>

                </div>


                <div class="detail-row">

                    <span>
                        Delivery
                    </span>

                    <span id="deliveryAmount">
                        FREE
                    </span>

                </div>


            </div>


            <!-- TOTAL -->

            <div class="success-total">

                <span>
                    Total Paid
                </span>

                <span id="orderTotal">
                    ₹0
                </span>

            </div>


            <!-- BUTTONS -->

            <div class="success-actions">


                <button
                    type="button"
                    class="continue-shopping-btn"
                    id="continueShoppingButton"
                >

                    Continue Shopping

                </button>


                <button
                    type="button"
                    class="view-order-btn"
                    id="viewOrderButton"
                >

                    View Order

                </button>


            </div>


        </section>


    </main>


    <script>

        /* ==========================================
   ORDER SUCCESS - PART 2
   ========================================== */


/* ==========================================
   GET SAVED ORDER
   ========================================== */

function getLastOrder() {

    try {

        const savedOrder =
            localStorage.getItem(
                "varnamLastOrder"
            );

        if (!savedOrder) {

            return null;

        }

        return JSON.parse(
            savedOrder
        );

    } catch (error) {

        return null;

    }

}


/* ==========================================
   FORMAT PRICE
   ========================================== */

function formatOrderPrice(price) {

    return "₹" +
        Number(price || 0)
            .toLocaleString("en-IN");

}


/* ==========================================
   LOAD ORDER
   ========================================== */

function loadOrder() {

    const order =
        getLastOrder();


    /* ======================================
       NO ORDER FOUND
       ====================================== */

    if (!order) {

        document.getElementById(
            "orderId"
        ).textContent =
            "No order found";

        document.getElementById(
            "customerName"
        ).textContent =
            "--";

        document.getElementById(
            "customerPhone"
        ).textContent =
            "--";

        document.getElementById(
            "paymentMethod"
        ).textContent =
            "--";

        document.getElementById(
            "itemCount"
        ).textContent =
            "0";

        document.getElementById(
            "deliveryAmount"
        ).textContent =
            "FREE";

        document.getElementById(
            "orderTotal"
        ).textContent =
            "₹0";

        return;

    }


    /* ======================================
       CUSTOMER
       ====================================== */

    document.getElementById(
        "orderId"
    ).textContent =
        order.orderId || "--";


    document.getElementById(
        "customerName"
    ).textContent =
        order.customer?.name || "--";


    document.getElementById(
        "customerPhone"
    ).textContent =
        order.customer?.phone || "--";


    /* ======================================
       PAYMENT
       ====================================== */

    document.getElementById(
        "paymentMethod"
    ).textContent =
        order.paymentMethod ||
        "Cash on Delivery";


    /* ======================================
       ITEM COUNT
       ====================================== */

    let itemCount = 0;


    if (Array.isArray(order.items)) {

        order.items.forEach(
            function(item) {

                itemCount +=
                    Number(
                        item.quantity
                    ) || 0;

            }
        );

    }


    document.getElementById(
        "itemCount"
    ).textContent =
        itemCount;


    /* ======================================
       DELIVERY
       ====================================== */

    const delivery =
        Number(order.delivery) || 0;


    document.getElementById(
        "deliveryAmount"
    ).textContent =
        delivery === 0
            ? "FREE"
            : formatOrderPrice(
                delivery
            );


    /* ======================================
       TOTAL
       ====================================== */

    document.getElementById(
        "orderTotal"
    ).textContent =
        formatOrderPrice(
            order.total
        );

}


/* ==========================================
   CONTINUE SHOPPING
   ========================================== */

document
    .getElementById(
        "continueShoppingButton"
    )
    .addEventListener(
        "click",
        function() {

            window.location.href =
                "index.html";

        }
    );


/* ==========================================
   VIEW ORDER
   ========================================== */

document
    .getElementById(
        "viewOrderButton"
    )
    .addEventListener(
        "click",
        function() {

            window.location.href = "order-details.html";
});


/* ==========================================
   TOP BACK BUTTON
   ========================================== */

document
    .getElementById(
        "backButton"
    )
    .addEventListener(
        "click",
        function() {

            window.location.href =
                "index.html";

        }
    );


/* ==========================================
   START
   ========================================== */

loadOrder();

    </script>


</body>

</html>
