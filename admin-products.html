<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Varnam Silks - Products</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f8f2ed;
            color: #321039;
        }


        /* =========================
           HEADER
        ========================= */

        .admin-header {

            height: 64px;

            background: #321039;

            display: flex;
            align-items: center;

            padding: 0 16px;

            color: white;

            position: sticky;
            top: 0;

            z-index: 100;
        }


        .back-btn {

            width: 38px;
            height: 38px;

            border: none;

            background: transparent;

            color: white;

            font-size: 25px;

            cursor: pointer;

            margin-right: 8px;
        }


        .header-title {

            flex: 1;
        }


        .header-title h1 {

            font-size: 17px;

            letter-spacing: 1px;
        }


        .header-title span {

            display: block;

            color: #d7a849;

            font-size: 9px;

            letter-spacing: 1.5px;

            margin-top: 3px;
        }


        /* =========================
           PAGE
        ========================= */

        .page {

            max-width: 1100px;

            margin: auto;

            padding: 20px 16px 40px;
        }


        .page-heading {

            display: flex;

            align-items: flex-start;

            justify-content: space-between;

            gap: 10px;

            margin-bottom: 18px;
        }


        .page-heading h2 {

            font-size: 22px;

            margin-bottom: 5px;

            color: #321039;
        }


        .page-heading p {

            font-size: 12px;

            color: #777;
        }


        /* =========================
           ADD BUTTON
        ========================= */

        .add-btn {

            border: none;

            background: #321039;

            color: white;

            border-radius: 7px;

            padding: 10px 13px;

            font-size: 11px;

            cursor: pointer;

            white-space: nowrap;
        }


        .add-btn span {

            color: #d7a849;

            font-size: 15px;

            margin-right: 3px;
        }


        /* =========================
           SEARCH
        ========================= */

        .search-box {

            background: white;

            border: 1px solid #eadfd8;

            border-radius: 8px;

            display: flex;

            align-items: center;

            padding: 0 12px;

            height: 45px;

            margin-bottom: 18px;
        }


        .search-icon {

            font-size: 18px;

            color: #777;

            margin-right: 8px;
        }


        .search-box input {

            width: 100%;

            border: none;

            outline: none;

            background: transparent;

            font-size: 12px;

            color: #321039;
        }


        .search-box input::placeholder {

            color: #aaa;
        }


        /* =========================
           PRODUCT COUNT
        ========================= */

        .product-summary {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 12px;
        }


        .product-summary h3 {

            font-size: 15px;

            color: #321039;
        }


        .product-count {

            font-size: 10px;

            color: #888;
        }


        /* =========================
           PRODUCT GRID
        ========================= */

        .products-grid {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 12px;
        }


        /* =========================
           PRODUCT CARD
        ========================= */

        .product-card {

            background: white;

            border: 1px solid #eadfd8;

            border-radius: 10px;

            overflow: hidden;

            box-shadow:
                0 3px 12px
                rgba(50, 16, 57, 0.06);
        }


        .product-image-wrapper {

            position: relative;

            width: 100%;

            height: 190px;

            background: #f8f2ed;
        }


        .product-image {

            width: 100%;

            height: 100%;

            object-fit: cover;

            display: block;
        }


        .stock-badge {

            position: absolute;

            top: 8px;

            left: 8px;

            padding: 5px 8px;

            border-radius: 20px;

            font-size: 8px;

            background: #e2f5e7;

            color: #24713b;
        }


        .stock-badge.out {

            background: #f9e3e3;

            color: #a33a3a;
        }


        .product-content {

            padding: 12px;
        }


        .product-name {

            font-size: 12px;

            font-weight: bold;

            color: #321039;

            line-height: 1.4;

            min-height: 34px;
        }


        .product-price {

            font-size: 15px;

            font-weight: bold;

            color: #321039;

            margin-top: 7px;
        }


        .product-code {

            font-size: 9px;

            color: #999;

            margin-top: 4px;
        }


        /* =========================
           ACTIONS
        ========================= */

        .product-actions {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 7px;

            margin-top: 12px;
        }


        .edit-btn,
        .delete-btn {

            height: 34px;

            border-radius: 6px;

            font-size: 10px;

            cursor: pointer;
        }


        .edit-btn {

            background: white;

            border: 1px solid #321039;

            color: #321039;
        }


        .delete-btn {

            background: #fff;

            border: 1px solid #c96a6a;

            color: #a33a3a;
        }


        /* =========================
           EMPTY SEARCH
        ========================= */

        .empty-products {

            grid-column: 1 / -1;

            background: white;

            border: 1px solid #eadfd8;

            border-radius: 10px;

            padding: 45px 20px;

            text-align: center;
        }


        .empty-icon {

            font-size: 35px;

            margin-bottom: 10px;
        }


        .empty-products h3 {

            font-size: 16px;

            margin-bottom: 5px;
        }


        .empty-products p {

            font-size: 11px;

            color: #888;
        }


        /* =========================
           DESKTOP
        ========================= */

        @media (min-width: 700px) {

            .page {

                padding: 28px;
            }

            .admin-header {

                padding: 0 28px;
            }

            .products-grid {

                grid-template-columns:
                    repeat(4, 1fr);

                gap: 16px;
            }

            .product-image-wrapper {

                height: 250px;
            }

        }


        @media (min-width: 1000px) {

            .products-grid {

                grid-template-columns:
                    repeat(5, 1fr);
            }

        }

    </style>

</head>

    /* ==========================================
   LOAD SAVED ADMIN PRODUCTS
========================================== */

function getSavedAdminProducts() {

    try {

        const saved =
            localStorage.getItem(
                "varnamAdminProducts"
            );

        if (!saved) {
            return [];
        }

        const products =
            JSON.parse(saved);

        return Array.isArray(products)
            ? products
            : [];

    } catch (error) {

        return [];

    }

}


const savedAdminProducts =
    getSavedAdminProducts();


/* ==========================================
   MERGE ALL PRODUCTS INTO ONE STORAGE
========================================== */

/* ==========================================

========================================== */

adminProducts.length = 0;

savedAdminProducts.forEach(

/* Use the complete list */

adminProducts.length = 0;

/* ==========================================
   FORMAT PRICE
========================================== */

function formatPrice(amount) {

    return "₹" +
        Number(amount || 0).toLocaleString(
            "en-IN"
        );

}


/* ==========================================
   DISPLAY PRODUCTS
========================================== */

function displayProducts(
    searchText = ""
) {

    const grid =
        document.getElementById(
            "productsGrid"
        );


    const search =
        searchText
            .trim()
            .toLowerCase();


    const filteredProducts =
        adminProducts.filter(
            function(product) {

                return product.name
                    .toLowerCase()
                    .includes(search);

            }
        );


    document.getElementById(
        "productCount"
    ).textContent =
        filteredProducts.length +
        (
            filteredProducts.length === 1
                ? " product"
                : " products"
        );


    /* ----------------------------------------
       NO RESULTS
    ---------------------------------------- */

    if (
        filteredProducts.length === 0
    ) {

        grid.innerHTML = `

            <div class="empty-products">

                <div class="empty-icon">
                    🔍
                </div>

                <h3>
                    No Products Found
                </h3>

                <p>
                    Try searching with another product name.
                </p>

            </div>

        `;

        return;

    }


    let html = "";


    /* ----------------------------------------
       PRODUCT CARDS
    ---------------------------------------- */

    filteredProducts.forEach(
        function(product) {

            html += `

                <article class="product-card">

                    <div class="product-image-wrapper">

                        <img
                            class="product-image"
                            src="${product.image}"
                            alt="${product.name}"
                        >

                        <span
                            class="stock-badge ${
                                product.stock
                                    ? ""
                                    : "out"
                            }"
                        >

                            ${
                                product.stock
                                    ? "In Stock"
                                    : "Out of Stock"
                            }

                        </span>

                    </div>


                    <div class="product-content">

                        <div class="product-name">

                            ${product.name}

                        </div>


                        <div class="product-price">

                            ${formatPrice(
                                product.price
                            )}

                        </div>


                        <div class="product-code">

                            Product ID:
                            VS-${String(
                                product.id
                            ).padStart(3, "0")}

                        </div>


                        <div class="product-actions">

                            <button
                                class="edit-btn"
                                onclick="editProduct(
    '${product.id}'
)"
                            >
                                Edit
                            </button>


                            <button
                                class="delete-btn"
                                onclick="deleteProduct(
    '${product.id}'
)"
                            >
                                Delete
                            </button>

                        </div>

                    </div>

                </article>

            `;

        }
    );


    grid.innerHTML =
        html;

}


/* ==========================================
   SEARCH
========================================== */

document
    .getElementById("searchInput")
    .addEventListener(
        "input",
        function() {

            displayProducts(
                this.value
            );

        }
    );

function editProduct(productId) {

    const product =
        adminProducts.find(
            function(item) {

                return String(item.id) ===
                       String(productId);

            }
        );


    if (!product) {

        alert(
            "Product not found."
        );

        return;

    }


    window.location.href =
        "admin-edit-product.html?id=" +
        encodeURIComponent(
            product.id
        );

}

/* ==========================================
   DELETE PRODUCT
========================================== */
/* ==========================================
   DELETE PRODUCT
========================================== */

function deleteProduct(productId) {

    const product =
        adminProducts.find(
            function(item) {

                return String(item.id) ===
                       String(productId);

            }
        );


    if (!product) {

        alert(
            "Product not found."
        );

        return;

    }


    const confirmDelete =
        confirm(
            "Delete this product?\n\n" +
            product.name
        );


    if (!confirmDelete) {

        return;

    }


    /* Remove from main product array */

    const productIndex =
        adminProducts.findIndex(
            function(item) {

                return String(item.id) ===
                       String(productId);

            }
        );


    if (productIndex !== -1) {

        adminProducts.splice(
            productIndex,
            1
        );

    }


    /* Save updated products */

    localStorage.setItem(
        "varnamAdminProducts",
        JSON.stringify(
            adminProducts
        )
    );


    alert(
        "Product deleted successfully."
    );


    /* Refresh product list */

    displayProducts();

}
