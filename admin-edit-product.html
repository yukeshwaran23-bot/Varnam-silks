<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Varnam Silks - Edit Product
    </title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family: Arial, sans-serif;

            background: #f8f2ed;

            color: #321039;
        }


        /* =========================
           HEADER
        ========================= */

        .admin-header {

            height: 64px;

            background: #321039;

            display: flex;

            align-items: center;

            padding: 0 16px;

            color: white;

            position: sticky;

            top: 0;

            z-index: 100;
        }


        .back-btn {

            width: 38px;

            height: 38px;

            border: none;

            background: transparent;

            color: white;

            font-size: 25px;

            cursor: pointer;

            margin-right: 8px;
        }


        .header-title {

            flex: 1;
        }


        .header-title h1 {

            font-size: 17px;

            letter-spacing: 1px;
        }


        .header-title span {

            display: block;

            color: #d7a849;

            font-size: 9px;

            letter-spacing: 1.5px;

            margin-top: 3px;
        }


        /* =========================
           PAGE
        ========================= */

        .page {

            max-width: 850px;

            margin: auto;

            padding: 20px 16px 45px;
        }


        .page-heading {

            margin-bottom: 20px;
        }


        .page-heading h2 {

            font-size: 22px;

            margin-bottom: 5px;

            color: #321039;
        }


        .page-heading p {

            font-size: 12px;

            color: #777;

            line-height: 1.5;
        }


        /* =========================
           FORM CARD
        ========================= */

        .form-card {

            background: white;

            border: 1px solid #eadfd8;

            border-radius: 10px;

            padding: 18px;

            margin-bottom: 16px;

            box-shadow:
                0 3px 12px
                rgba(50, 16, 57, 0.05);
        }


        .card-title {

            font-size: 15px;

            font-weight: bold;

            color: #321039;

            margin-bottom: 16px;

            padding-bottom: 10px;

            border-bottom: 1px solid #eee;
        }


        /* =========================
           PRODUCT IMAGE
        ========================= */

        .current-image {

            width: 100%;

            height: 280px;

            object-fit: contain;

            display: block;

            background: #f8f2ed;

            border-radius: 8px;

            border: 1px solid #eadfd8;
        }


        .image-help {

            font-size: 9px;

            color: #999;

            margin-top: 7px;

            line-height: 1.4;
        }


        /* =========================
           FORM
        ========================= */

        .form-group {

            margin-bottom: 15px;
        }


        .form-group:last-child {

            margin-bottom: 0;
        }


        label {

            display: block;

            font-size: 11px;

            font-weight: bold;

            color: #321039;

            margin-bottom: 7px;
        }


        .required {

            color: #a33a3a;
        }


        input,
        textarea,
        select {

            width: 100%;

            border: 1px solid #ddd1ca;

            border-radius: 6px;

            outline: none;

            background: white;

            color: #321039;

            font-family: Arial, sans-serif;

            font-size: 12px;

            padding: 11px 12px;
        }


        input:focus,
        textarea:focus,
        select:focus {

            border-color: #321039;
        }


        textarea {

            min-height: 100px;

            resize: vertical;

            line-height: 1.5;
        }


        .form-row {

            display: grid;

            grid-template-columns:
                1fr;

            gap: 15px;
        }


        .input-help {

            font-size: 9px;

            color: #999;

            margin-top: 5px;

            line-height: 1.4;
        }


        /* =========================
           PRODUCT OPTIONS
        ========================= */

        .options-grid {

            display: grid;

            grid-template-columns:
                1fr;

            gap: 10px;
        }


        .check-option {

            display: flex;

            align-items: center;

            gap: 9px;

            padding: 11px;

            border: 1px solid #eadfd8;

            border-radius: 6px;

            cursor: pointer;

            background: #fdfaf8;
        }


        .check-option input {

            width: auto;

            accent-color: #321039;
        }


        .check-option span {

            font-size: 11px;

            color: #321039;
        }


        /* =========================
           PRODUCT ID
        ========================= */

        .product-id {

            background: #f8f2ed;

            border-radius: 6px;

            padding: 11px 12px;

            font-size: 11px;

            color: #777;

            margin-bottom: 15px;
        }


        .product-id strong {

            color: #321039;
        }


        /* =========================
           ERROR
        ========================= */

        .error-message {

            display: none;

            background: #fff0f0;

            border: 1px solid #e7bcbc;

            color: #9b3333;

            border-radius: 6px;

            padding: 10px 12px;

            font-size: 10px;

            line-height: 1.5;

            margin-bottom: 15px;
        }


        /* =========================
           BUTTONS
        ========================= */

        .button-row {

            display: flex;

            flex-direction: column;

            gap: 9px;

            margin-top: 20px;
        }


        .save-btn,
        .cancel-btn {

            width: 100%;

            height: 45px;

            border-radius: 7px;

            font-size: 12px;

            font-weight: bold;

            cursor: pointer;
        }


        .save-btn {

            background: #321039;

            color: white;

            border: 1px solid #321039;
        }


        .cancel-btn {

            background: white;

            color: #321039;

            border: 1px solid #321039;
        }


        /* =========================
           DESKTOP
        ========================= */

        @media (min-width: 700px) {

            .page {

                padding: 28px;
            }


            .admin-header {

                padding: 0 28px;
            }


            .form-card {

                padding: 22px;
            }


            .form-row {

                grid-template-columns:
                    1fr 1fr;
            }


            .options-grid {

                grid-template-columns:
                    repeat(3, 1fr);
            }


            .button-row {

                flex-direction: row;

                justify-content: flex-end;
            }


            .save-btn,
            .cancel-btn {

                width: 160px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <header class="admin-header">


        <button
            class="back-btn"
            id="backBtn"
            aria-label="Back"
        >
            ←
        </button>


        <div class="header-title">

            <h1>
                VARNAM SILKS
            </h1>

            <span>
                EDIT PRODUCT
            </span>

        </div>


    </header>


    <!-- =========================
         MAIN
    ========================= -->

    <main class="page">


        <section class="page-heading">

            <h2>
                Edit Product
            </h2>

            <p>
                Update your saree product information.
            </p>

        </section>


        <!-- ERROR -->

        <div
            class="error-message"
            id="errorMessage"
        >
        </div>


        <!-- =========================
             PRODUCT INFORMATION
        ========================= -->

        <section class="form-card">

            <h3 class="card-title">
                Product Details
            </h3>


            <div
                class="product-id"
                id="productIdDisplay"
            >
                Product ID:
                <strong>Loading...</strong>
            </div>


            <div class="form-group">

                <label>
                    Current Product Image
                </label>


                <img
                    class="current-image"
                    id="currentImage"
                    src=""
                    alt="Product image"
                >


                <p class="image-help">
                    Product image is currently stored with the product.
                </p>

            </div>


            <div class="form-group">

                <label for="productName">

                    Product Name
                    <span class="required">*</span>

                </label>


                <input
                    type="text"
                    id="productName"
                    maxlength="100"
                    placeholder="Product name"
                >

            </div>


            <div class="form-row">


                <div class="form-group">

                    <label for="productPrice">

                        Price
                        <span class="required">*</span>

                    </label>


                    <input
                        type="number"
                        id="productPrice"
                        min="1"
                        step="1"
                        placeholder="Price"
                    >

                </div>


                <div class="form-group">

                    <label for="productStock">

                        Stock Quantity
                        <span class="required">*</span>

                    </label>


                    <input
                        type="number"
                        id="productStock"
                        min="0"
                        step="1"
                        placeholder="Stock"
                    >

                </div>


            </div>


            <div class="form-group">

                <label for="productCategory">

                    Category
                    <span class="required">*</span>

                </label>


                <select
                    id="productCategory"
                >

                    <option value="">
                        Select category
                    </option>

                    <option value="Kanchipuram Silk">
                        Kanchipuram Silk
                    </option>

                    <option value="Soft Silk">
                        Soft Silk
                    </option>

                    <option value="Banarasi Silk">
                        Banarasi Silk
                    </option>

                    <option value="Designer Sarees">
                        Designer Sarees
                    </option>

                    <option value="Wedding Sarees">
                        Wedding Sarees
                    </option>

                    <option value="Festive Sarees">
                        Festive Sarees
                    </option>

                    <option value="New Arrivals">
                        New Arrivals
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="productDescription">

                    Description

                </label>


                <textarea
                    id="productDescription"
                    maxlength="1000"
                    placeholder="Product description"
                ></textarea>

            </div>

        </section>


        <!-- =========================
             OPTIONS
        ========================= -->

        <section class="form-card">

            <h3 class="card-title">
                Product Options
            </h3>


            <div class="options-grid">


                <label class="check-option">

                    <input
                        type="checkbox"
                        id="isNewArrival"
                    >

                    <span>
                        New Arrival
                    </span>

                </label>


                <label class="check-option">

                    <input
                        type="checkbox"
                        id="isBestSelling"
                    >

                    <span>
                        Best Selling
                    </span>

                </label>


                <label class="check-option">

                    <input
                        type="checkbox"
                        id="isFeatured"
                    >

                    <span>
                        Featured Product
                    </span>

                </label>


            </div>

        </section>


        <!-- =========================
             BUTTONS
        ========================= -->

        <div class="button-row">


            <button
                type="button"
                class="cancel-btn"
                id="cancelBtn"
            >
                Cancel
            </button>


            <button
                type="button"
                class="save-btn"
                id="saveProductBtn"
            >
                Save Changes
            </button>


        </div>


    </main>


    <!-- PART 2 GOES HERE -->
  <script>

/* ==========================================
   EDIT PRODUCT
========================================== */


/* ==========================================
   ELEMENTS
========================================== */

const productIdDisplay =
    document.getElementById(
        "productIdDisplay"
    );

const currentImage =
    document.getElementById(
        "currentImage"
    );

const productName =
    document.getElementById(
        "productName"
    );

const productPrice =
    document.getElementById(
        "productPrice"
    );

const productStock =
    document.getElementById(
        "productStock"
    );

const productCategory =
    document.getElementById(
        "productCategory"
    );

const productDescription =
    document.getElementById(
        "productDescription"
    );

const isNewArrival =
    document.getElementById(
        "isNewArrival"
    );

const isBestSelling =
    document.getElementById(
        "isBestSelling"
    );

const isFeatured =
    document.getElementById(
        "isFeatured"
    );

const errorMessage =
    document.getElementById(
        "errorMessage"
    );


/* ==========================================
   GET PRODUCT ID FROM URL
========================================== */

const urlParams =
    new URLSearchParams(
        window.location.search
    );


const productId =
    urlParams.get("id");


/* ==========================================
   GET SAVED PRODUCTS
========================================== */

function getSavedProducts() {

    try {

        const saved =
            localStorage.getItem(
                "varnamAdminProducts"
            );


        if (!saved) {

            return [];

        }


        const products =
            JSON.parse(saved);


        return Array.isArray(products)
            ? products
            : [];

    } catch (error) {

        return [];

    }

}


/* ==========================================
   SHOW ERROR
========================================== */

function showError(message) {

    errorMessage.textContent =
        message;

    errorMessage.style.display =
        "block";


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}


function hideError() {

    errorMessage.textContent =
        "";

    errorMessage.style.display =
        "none";

}


/* ==========================================
   LOAD PRODUCT
========================================== */

function loadProduct() {

    if (!productId) {

        showError(
            "Product ID is missing."
        );

        return;

    }


    const products =
        getSavedProducts();


    const product =
        products.find(
            function(item) {

                return String(
                    item.id
                ) === String(
                    productId
                );

            }
        );


    if (!product) {

        showError(
            "Product not found."
        );

        return;

    }


    /* Product ID */

    productIdDisplay.innerHTML =
        "Product ID: <strong>" +
        product.id +
        "</strong>";


    /* Image */

    if (product.image) {

        currentImage.src =
            product.image;

    } else {

        currentImage.style.display =
            "none";

    }


    /* Product information */

    productName.value =
        product.name || "";


    productPrice.value =
        product.price || "";


    productStock.value =
        product.stock ?? "";


    productCategory.value =
        product.category || "";


    productDescription.value =
        product.description || "";


    /* Product options */

    isNewArrival.checked =
        product.isNewArrival === true;


    isBestSelling.checked =
        product.isBestSelling === true;


    isFeatured.checked =
        product.isFeatured === true;


    hideError();

}


/* ==========================================
   VALIDATE
========================================== */

function validateForm() {

    const name =
        productName.value.trim();


    const price =
        Number(
            productPrice.value
        );


    const stock =
        Number(
            productStock.value
        );


    const category =
        productCategory.value;


    if (!name) {

        showError(
            "Please enter the product name."
        );

        return false;

    }


    if (
        !price ||
        price <= 0
    ) {

        showError(
            "Please enter a valid price."
        );

        return false;

    }


    if (
        isNaN(stock) ||
        stock < 0
    ) {

        showError(
            "Please enter a valid stock quantity."
        );

        return false;

    }


    if (!category) {

        showError(
            "Please select a category."
        );

        return false;

    }


    hideError();

    return true;

}


/* ==========================================
   SAVE CHANGES
========================================== */

document
    .getElementById(
        "saveProductBtn"
    )
    .addEventListener(
        "click",
        function() {


            if (!validateForm()) {

                return;

            }


            const products =
                getSavedProducts();


            const productIndex =
                products.findIndex(
                    function(item) {

                        return String(
                            item.id
                        ) === String(
                            productId
                        );

                    }
                );


            if (productIndex === -1) {

                showError(
                    "Product could not be found."
                );

                return;

            }


            /*
             * Keep the existing image.
             * We are not changing the image
             * from the Edit page yet.
             */

            const oldImage =
                products[
                    productIndex
                ].image || "";


            products[
                productIndex
            ] = {

                ...products[
                    productIndex
                ],

                name:
                    productName.value.trim(),

                price:
                    Number(
                        productPrice.value
                    ),

                stock:
                    Number(
                        productStock.value
                    ),

                category:
                    productCategory.value,

                description:
                    productDescription.value.trim(),

                isNewArrival:
                    isNewArrival.checked,

                isBestSelling:
                    isBestSelling.checked,

                isFeatured:
                    isFeatured.checked,

                image:
                    oldImage,

                updatedAt:
                    new Date().toISOString()

            };


            localStorage.setItem(

                "varnamAdminProducts",

                JSON.stringify(
                    products
                )

            );


            alert(
                "Product updated successfully."
            );


            window.location.href =
                "admin-products.html";

        }
    );


/* ==========================================
   CANCEL
========================================== */

document
    .getElementById(
        "cancelBtn"
    )
    .addEventListener(
        "click",
        function() {

            window.location.href =
                "admin-products.html";

        }
    );


/* ==========================================
   BACK BUTTON
========================================== */

document
    .getElementById(
        "backBtn"
    )
    .addEventListener(
        "click",
        function() {

            window.location.href =
                "admin-products.html";

        }
    );


/* ==========================================
   START
========================================== */

loadProduct();

  </script>


</body>

</html>
