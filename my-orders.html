<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Orders | VARNAM SILKS</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f8f2ed;
            color: #321039;
        }

        .topbar {
            height: 64px;
            background: #321039;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .back-btn {
            width: 35px;
            height: 35px;
            border: none;
            background: transparent;
            color: white;
            font-size: 27px;
            cursor: pointer;
        }

        .brand {
            text-align: center;
        }

        .brand h1 {
            font-size: 18px;
            letter-spacing: 2px;
        }

        .brand p {
            font-size: 8px;
            color: #d7a849;
            letter-spacing: 1.5px;
            margin-top: 3px;
        }

        .top-space {
            width: 35px;
        }

        .page {
            width: 100%;
            max-width: 650px;
            margin: auto;
            padding: 22px 15px 40px;
        }

        .page-title {
            text-align: center;
            margin-bottom: 22px;
        }

        .page-title h2 {
            font-size: 24px;
            color: #321039;
        }

        .page-title p {
            font-size: 13px;
            color: #777;
            margin-top: 6px;
        }

        .order-card {
            background: white;
            border-radius: 15px;
            padding: 17px;
            margin-bottom: 15px;
            box-shadow: 0 3px 12px rgba(50, 16, 57, 0.08);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            padding-bottom: 14px;
            border-bottom: 1px solid #eee;
        }

        .order-id {
            font-size: 14px;
            font-weight: bold;
            color: #321039;
        }

        .order-date {
            font-size: 11px;
            color: #888;
            margin-top: 5px;
        }

        .status {
            padding: 6px 10px;
            border-radius: 20px;
            background: #fff4d8;
            color: #8a6414;
            font-size: 11px;
            font-weight: bold;
            white-space: nowrap;
        }

        .status.delivered {
            background: #e6f6eb;
            color: #267344;
        }

        .status.cancelled {
            background: #fde8e8;
            color: #b52b2b;
        }

        .order-info {
            display: flex;
            justify-content: space-between;
            padding: 13px 0;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .info-label {
            font-size: 11px;
            color: #888;
        }

        .info-value {
            font-size: 14px;
            font-weight: bold;
            color: #321039;
        }

        .item-preview {
            display: flex;
            gap: 9px;
            margin-top: 2px;
            overflow: hidden;
        }

        .item-image {
            width: 52px;
            height: 62px;
            object-fit: cover;
            border-radius: 7px;
            background: #f1e8e2;
            flex-shrink: 0;
        }

        .more-items {
            width: 52px;
            height: 62px;
            border-radius: 7px;
            background: #f1e8e2;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #321039;
            font-size: 12px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .order-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 15px;
            padding-top: 14px;
            border-top: 1px solid #eee;
        }

        .total-label {
            font-size: 12px;
            color: #777;
        }

        .total-price {
            font-size: 18px;
            font-weight: bold;
            color: #321039;
            margin-top: 3px;
        }

        .view-btn {
            border: 1px solid #321039;
            background: white;
            color: #321039;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .view-btn:hover {
            background: #321039;
            color: white;
        }

        .empty {
            background: white;
            border-radius: 15px;
            padding: 45px 20px;
            text-align: center;
            box-shadow: 0 3px 12px rgba(50, 16, 57, 0.08);
        }

        .empty-icon {
            font-size: 42px;
            margin-bottom: 12px;
        }

        .empty h3 {
            color: #321039;
            font-size: 19px;
        }

        .empty p {
            color: #777;
            font-size: 13px;
            margin-top: 7px;
        }

        .shop-btn {
            margin-top: 20px;
            width: 100%;
            max-width: 250px;
            height: 45px;
            border: none;
            border-radius: 9px;
            background: #321039;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        @media (min-width: 700px) {

            .page {
                padding-top: 30px;
            }

            .topbar {
                padding: 0 30px;
            }
        }
    </style>
</head>

<body>

    <header class="topbar">

        <button
            class="back-btn"
            onclick="window.location.href='index.html'">
            ←
        </button>

        <div class="brand">
            <h1>VARNAM SILKS</h1>
            <p>SAREES THAT SPEAK ELEGANCE</p>
        </div>

        <div class="top-space"></div>

    </header>


    <main class="page">

        <div class="page-title">

            <h2>My Orders</h2>

            <p>
                Track and view your Varnam Silks orders
            </p>

        </div>


        <div id="ordersContainer"></div>

    </main>


    <script>

        const ordersContainer =
            document.getElementById("ordersContainer");


        function formatPrice(price) {

            return "₹" +
                Number(price || 0).toLocaleString("en-IN");

        }


        function formatDate(dateString) {

            if (!dateString) {
                return "-";
            }

            const date = new Date(dateString);

            return date.toLocaleDateString("en-IN", {
                day: "2-digit",
                month: "short",
                year: "numeric"
            });

        }


        function getStatusClass(status) {

            if (!status) {
                return "";
            }

            const value = status.toLowerCase();

            if (value.includes("delivered")) {
                return "delivered";
            }

            if (
                value.includes("cancel") ||
                value.includes("rejected")
            ) {
                return "cancelled";
            }

            return "";
        }


        function showEmptyOrders() {

            ordersContainer.innerHTML = `

                <div class="empty">

                    <div class="empty-icon">
                        🛍️
                    </div>

                    <h3>No Orders Yet</h3>

                    <p>
                        Your purchased sarees will appear here.
                    </p>

                    <button
                        class="shop-btn"
                        onclick="window.location.href='index.html'">

                        Start Shopping

                    </button>

                </div>

            `;
        }


        function loadOrders() {

    const savedOrders =
        localStorage.getItem(
            "varnamOrders"
        );


    if (!savedOrders) {

        showEmptyOrders();

        return;

    }


    let orders;

    try {

        orders =
            JSON.parse(
                savedOrders
            );

    } catch (error) {

        showEmptyOrders();

        return;

    }


    if (
        !Array.isArray(orders) ||
        orders.length === 0
    ) {

        showEmptyOrders();

        return;

    }


    let ordersHTML = "";


    orders.forEach(
        function(order) {


            const items =
                order.items || [];


            let previewHTML = "";


            const previewItems =
                items.slice(0, 4);


            previewItems.forEach(
                function(item) {

                    previewHTML += `

                        <img
                            class="item-image"
                            src="${item.image || ""}"
                            alt="${item.name || "Product"}"
                        >

                    `;

                }
            );


            if (items.length > 4) {

                previewHTML += `

                    <div class="more-items">

                        +${items.length - 4}

                    </div>

                `;

            }


            ordersHTML += `

                <div class="order-card">


                    <div class="order-header">


                        <div>

                            <div class="order-id">

                                ${order.orderId || "Order"}

                            </div>


                            <div class="order-date">

                                ${formatDate(
                                    order.createdAt
                                )}

                            </div>

                        </div>


                        <div
                            class="status ${getStatusClass(
                                order.status
                            )}"
                        >

                            ${
                                order.status ||
                                "Order Placed"
                            }

                        </div>


                    </div>



                    <div class="order-info">


                        <div class="info-item">

                            <span class="info-label">

                                Items

                            </span>


                            <span class="info-value">

                                ${items.length}

                            </span>

                        </div>



                        <div class="info-item">

                            <span class="info-label">

                                Payment

                            </span>


                            <span class="info-value">

                                ${
                                    order.paymentMethod ||
                                    "COD"
                                }

                            </span>

                        </div>


                    </div>



                    <div class="item-preview">

                        ${previewHTML}

                    </div>



                    <div class="order-footer">


                        <div>

                            <div class="total-label">

                                Total Amount

                            </div>


                            <div class="total-price">

                                ${formatPrice(
                                    order.total
                                )}

                            </div>

                        </div>



                        <button
                            class="view-btn"
                            onclick="
                                viewOrder(
                                    '${order.orderId}'
                                )
                            "
                        >

                            View Order

                        </button>


                    </div>


                </div>

            `;


        }
    );


    ordersContainer.innerHTML =
        ordersHTML;

        }


        function viewOrder(orderId) {

    window.location.href =
        "order-details.html?id=" +
        encodeURIComponent(orderId);

        }


        loadOrders();

    </script>

</body>
</html>
